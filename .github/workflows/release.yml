name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TodoList AI ${{ github.ref_name }}'
          releaseBody: |
            macOS 用户下载 dmg 后，如果系统提示「无法验证开发者」，右键点 App 图标选打开，或运行：
            `xattr -cr "/Applications/TodoList AI.app"`
          releaseDraft: false
          prerelease: false
